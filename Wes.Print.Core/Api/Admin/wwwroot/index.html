<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>打印服务 · Wes Print</title>
  <link rel="stylesheet" href="/admin/app.css">
  <script>
    window.addEventListener('error', function (e) {
      var bar = document.getElementById('errbar');
      if (!bar) { bar = document.createElement('div'); bar.id = 'errbar';
        bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#b00;color:#fff;font:13px/1.6 monospace;padding:8px 12px;white-space:pre-wrap';
        document.body.appendChild(bar); }
      bar.textContent = 'JS错误: ' + (e.message || e.error) + (e.filename ? (' @ ' + e.filename + ':' + e.lineno) : '');
    });
  </script>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">Wes<span>·</span>Print</div>
      <div class="sub">打印服务管理</div>
      <div class="top-printer">
        <label>选择打印机</label>
        <select id="printer"></select>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-btn" data-view="mq">消息队列</button>
      <button class="nav-btn" data-view="records">打印记录</button>
      <button class="nav-btn" data-view="templates">打印模板</button>
      <button class="nav-btn" data-view="settings">系统设置</button>
    </nav>

    <!-- 消息队列：RabbitMQ / Kafka 双通道，可同时开启 -->
    <section class="view" id="view-mq">

      <!-- RabbitMQ 通道 -->
      <div class="card" id="card-rabbitmq">
        <div class="titlebar">
          <h2>RabbitMQ <span class="dot muted mq-dot" data-key="rabbitmq" title=""></span></h2>
          <label class="switch"><input type="checkbox" class="mq-on" data-key="rabbitmq" checked><span>启用</span></label>
        </div>
        <div class="mq-body" data-key="rabbitmq">
          <div class="row3">
            <div><label>主机 Host</label><input class="f-host" placeholder="127.0.0.1"></div>
            <div><label>端口 Port</label><input class="f-port" type="number" placeholder="5672"></div>
            <div><label>用户名 UserName</label><input class="f-user" placeholder="guest"></div>
            <div><label>密码 Password</label><input class="f-pass" type="password" placeholder="guest"></div>
            <div><label>队列 Queue</label><input class="f-queue" placeholder="wes_print_queue"></div>
          </div>
          <div class="mqStatus">
            <div class="mqInfo"><span class="dot muted mq-dot2" data-key="rabbitmq"></span><span class="mq-text" data-key="rabbitmq">未连接</span></div>
            <button class="btn-connect mq-toggle" data-key="rabbitmq">连接</button>
          </div>
        </div>
      </div>

      <!-- Kafka 通道 -->
      <div class="card" id="card-kafka">
        <div class="titlebar">
          <h2>Kafka <span class="dot muted mq-dot" data-key="kafka" title=""></span></h2>
          <label class="switch"><input type="checkbox" class="mq-on" data-key="kafka" checked><span>启用</span></label>
        </div>
        <div class="mq-body" data-key="kafka">
          <div class="row3">
            <div><label>BootstrapServers</label><input class="f-bootstrap" placeholder="127.0.0.1:9092"></div>
            <div><label>Topic</label><input class="f-queue" placeholder="wes_print_topic"></div>
            <div><label>消费组 GroupId</label><input class="f-group" placeholder="wes-print-group"></div>
            <div><label>用户名 UserName</label><input class="f-user" placeholder="可选 SASL"></div>
            <div><label>密码 Password</label><input class="f-pass" type="password" placeholder="可选 SASL"></div>
          </div>
          <div class="mqStatus">
            <div class="mqInfo"><span class="dot muted mq-dot2" data-key="kafka"></span><span class="mq-text" data-key="kafka">未连接</span></div>
            <button class="btn-connect mq-toggle" data-key="kafka">连接</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 打印记录 -->
    <section class="view" id="view-records">
      <div class="card">
        <h2>打印记录</h2>
        <div class="row">
          <select id="channel"><option value="">渠道（全部）</option><option value="Api">Api</option><option value="RabbitMQ">RabbitMQ</option></select>
          <select id="status"><option value="">状态（全部）</option><option value="Success">Success</option><option value="Failed">Failed</option><option value="Pending">Pending</option></select>
        </div>
        <div class="tablewrap">
          <table>
            <colgroup>
              <col style="width:118px">
              <col style="width:64px"><col style="width:160px"><col style="width:120px"><col style="width:170px"><col style="width:104px"><col><col style="width:84px">
            </colgroup>
            <thead><tr><th>渠道</th><th>类型</th><th>模板</th><th>打印机</th><th>时间</th><th>状态</th><th>信息</th><th>操作</th></tr></thead>
            <tbody id="rows"><tr><td colspan="8" style="color:var(--muted)">加载中…</td></tr></tbody>
          </table>
        </div>
        <div class="pager" id="pager"></div>
      </div>
    </section>

    <!-- 打印模板设计器 -->
    <section class="view" id="view-templates">
      <div class="card tpl-card">
        <div class="tpl-toolbar">
          <div class="tpl-group">
            <select id="tplList" title="选择模板"><option value="">（新建空白模板）</option></select>
            <div class="add-toolbar">
              <button class="btn-sm" data-add="text" title="添加文本">T</button>
              <button class="btn-sm" data-add="barcode" title="添加条码">▦</button>
              <button class="btn-sm" data-add="line" title="添加直线">╱</button>
              <button class="btn-sm" data-add="image" title="添加图片">▣</button>
            </div>
          </div>
          <div class="tpl-group tpl-group-right">
            <input id="tplSaveName" class="tpl-savename" type="text" placeholder="模板名" />
            <button id="tplSave" class="btn-sm primary">保存</button>
            <button id="tplDelete" class="btn-sm danger">删除</button>
            <button id="tplPreview" class="btn-sm">预览</button>
            <button id="tplExport" class="btn-sm">导出</button>
          </div>
        </div>
        <div class="tpl-body">
          <div class="tpl-canvas-wrap" id="tplCanvasWrap">
            <div class="tpl-zoombar">
              <button class="btn-sm" data-zoom="-" title="缩小">−</button>
              <select id="tplZoom" title="缩放">
                <option value="0">自适应</option>
                <option value="0.5">50%</option>
                <option value="0.75">75%</option>
                <option value="1">100%</option>
                <option value="1.25">125%</option>
                <option value="1.5">150%</option>
                <option value="2">200%</option>
              </select>
              <button class="btn-sm" data-zoom="+" title="放大">+</button>
            </div>
            <div class="tpl-canvas-scaler" id="tplCanvasScaler">
              <div class="tpl-canvas" id="tplCanvas"></div>
            </div>
          </div>
          <aside class="tpl-side">
            <div class="tpl-tabs">
              <button class="tpl-tab active" data-tab="page">页面</button>
              <button class="tpl-tab" data-tab="elem">元素</button>
            </div>
            <div class="tpl-tab-panel" data-panel="page">
              <div class="fld"><label>纸张规格</label><select id="pgPreset">
                <option value="">自定义</option>
                <option value="a4">A4 (210×297 mm)</option>
                <option value="a5">A5 (148×210 mm)</option>
                <option value="a6">A6 (105×148 mm)</option>
                <option value="label-40">标签 40×30 mm</option>
                <option value="label-60">标签 60×40 mm</option>
                <option value="label-80">标签 80×50 mm</option>
                <option value="label-100">标签 100×60 mm</option>
                <option value="pos-80">热敏小票 80×200 mm</option>
              </select></div>
              <div class="fld-grid">
                <div class="fld"><label>宽 Width</label><input id="pgW" type="number" step="0.1"></div>
                <div class="fld"><label>高 Height</label><input id="pgH" type="number" step="0.1"></div>
                <div class="fld"><label>DPI</label><input id="pgDpi" type="number"></div>
                <div class="fld"><label>单位</label><select id="pgUnit"><option value="mm">mm</option><option value="px">px</option><option value="in">in</option></select></div>
                <div class="fld fld-wide"><label>背景色</label><input id="pgBg" type="color" value="#ffffff"></div>
              </div>
            </div>
            <div class="tpl-tab-panel" data-panel="elem" hidden>
              <div id="propFields" style="display:none"></div>
            </div>
          </aside>
        </div>
        <div class="tpl-preview" id="tplPreviewBox" hidden>
          <div class="tpl-side-h">渲染预览</div>
          <div id="tplPreviewImg"><span class="muted">点击「预览」生成</span></div>
        </div>
      </div>
    </section>

    <!-- 系统设置 -->
    <section class="view" id="view-settings">
      <div class="card">
        <h2>系统设置</h2>
        <div class="row">
          <div style="flex:0 0 260px"><label>打印记录保留天数</label><input id="retention" type="number" min="1"></div>
          <button id="saveRetention" class="btn-sm primary">保存</button>
          <button id="purgeNow" class="btn-sm danger">立即清理</button>
        </div>
        <div class="row" style="margin-top:14px">
          <button id="openSettingsMq" class="btn-sm">前往消息队列设置</button>
        </div>
      </div>
    </section>
  </div>
  <div class="toast" id="toast"></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-mask" id="modalMask"></div>
    <div class="modal-box">
      <div class="modal-head">
        <span>打印参数详情</span>
        <button class="modal-x" id="modalX" title="关闭">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="/admin/app.js"></script>
</body>
</html>
